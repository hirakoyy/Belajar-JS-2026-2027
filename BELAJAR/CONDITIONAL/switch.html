<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Switch JS</title>
  </head>
  <body>
    <script>
      //   Switch is another way to make decisions in JS
      //   Like if else

      // Switch example
      const fruit = "banana";

      switch (fruit) {
        case "banana":
          console.log("I am a banana");
          break;
        case "apple":
          console.log("I am an apple");
          break;
        case "orange":
          console.log("I am an orange");
          break;
        case "strawberry":
          console.log("I am a strawberry");
          break;
        default:
          console.log("I am not a fruit. I am a programmer");
      }

      //   Difference between if else and switch

      const day = new Date().getDay();

      if (day === 0) {
        console.log("Sunday");
      } else if (day === 1) {
        console.log("Monday");
      } else if (day === 2) {
        console.log("Tuesday");
      } else if (day === 3) {
        console.log("Wednesday");
      } else if (day === 4) {
        console.log("Thursday");
      } else if (day === 5) {
        console.log("Friday");
      } else if (day === 6) {
        console.log("Saturday");
      } else {
        console.log("Invalid day");
      }

      //   Without using 'break'
      const numbre = 2;
      switch (numbre) {
        case 1:
          console.log("Ts 1");
          break;
        case 2:
          console.log("Ts 2");
        case 3:
          console.log("Ts 3");
          break;
        default:
          console.log("ts default");
      }

      //   Multiple case
      let food = "pizza";

      switch (food) {
        case "pizza":
        case "burger":
          console.log("ts junkfood");
          break;
        case "salad":
          console.log("ts healthy");
          break;
        default:
          console.log("idk what food ts");
      }
      //   Switch uses strict comparison

      let valuebozo = "10";
      switch (valuebozo) {
        case 10:
          console.log("ts number");
          break;
        case "10":
          console.log("ts string");
          break;
      }

      
      let chosenFood = prompt(
        "Pilih salah satu makanan di bawah untuk mengetahui jika ia makanan cepat saji atau makanan sehat:\n\n pizza, burger, kentang goreng, hotdog, salad, apel, brokoli, oatmeal",
      );

      switch (chosenFood) {
        case "pizza":
        case "burger":
        case "kentang goreng":
        case "hotdog":
          alert("makanan cepat saji");
          break;
        case "salad":
        case "apel":
        case "brokoli":
        case "oatmeal":
          alert("makanan sehat");
          break;
        default:
          alert("makanan tidak ada di menu");
          break;
      }
    </script>
  </body>
</html>
