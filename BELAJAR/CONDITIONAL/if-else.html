<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>if else</title>
  </head>
  <body>
    <script>
      let laukPagi = "ayam semur";
      if (laukPagi === "ayam semur") {
        console.log("Makan pagi pake ayam semur");
      } else {
        console.log("Makan pagi tidak pake ayam semur");
      }
      let num = 2;
      if (num % 2 == 0) {
        console.log("Even number");
      } else if (num % 2 == 1) {
        console.log("Odd number");
      } else {
        console.log("You didn't not input a number");
      }
    </script>
  </body>
</html>
