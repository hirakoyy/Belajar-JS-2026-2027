<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>function js</title>
  </head>
  <body>
    <script>
      function helloWorld() {
        console.log("Hello World");
      }

      helloWorld();

      function looping(a) {
        for (n = 1; n <= a; n++) {
          console.log(`number ${n}`);
        }
      }
      looping(11);
      function declare(a) {
        console.log(a);
      }

      declare("oi");
      declare("wey");
      declare("mantap");

      //   more than 1 parameter

      // pertambahan

      function addition(x, y) {
        console.log(x + y);
      }

      addition(2, 5);

      // pengurangan

      function subtraction(x, y) {
        console.log(x - y);
      }

      subtraction(2, 5);

      // perkalian

      function multiplication(x, y) {
        console.log(x * y);
      }

      multiplication(2, 5);

      // pembagian

      function division(x, y) {
        console.log(x + y);
      }

      division(2, 5);

      //   pythagoras theorem

      function pythagoras(a, b) {
        let c = Math.sqrt(a ** 2 + b ** 2);
        console.log(c);
      }
      pythagoras(3, 4);
    </script>
  </body>
</html>
