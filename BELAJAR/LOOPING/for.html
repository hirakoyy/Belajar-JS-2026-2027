<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>for</title>
  </head>
  <body>
    <script>
      // for loop
      let hello = "hello world";
      for (let i = 1; i < 10; i++) {
        console.log(hello);
      }
      // if in a loop (difference/anomaly)
      for (let car = 1; car <= 10; car++) {
        if (car == 9) {
          console.log(`car ${car} broken`);
        } else if (car == 2) {
          console.log(`car ${car} stolen`);
        } else {
          console.log(`car ${car} alright`);
        }
      }
     
    </script>
  </body>
</html>
