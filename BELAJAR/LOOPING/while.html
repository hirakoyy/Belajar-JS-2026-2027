<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>while</title>
  </head>
  <body>
    <script>
      // while
      let bus = 1;
      while (bus <= 10) {
        console.log(`Bus ${bus}`);
        bus++;
      }
      //   do-while
      let train = 0;
      do {
        console.log(`Train ${train}`);
        train++;
      } while (train < 5);
    </script>
  </body>
</html>
